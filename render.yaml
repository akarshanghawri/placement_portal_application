services:
  - type: web
    name: placement-portal-web
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn -w 4 -b 0.0.0.0:5000 run:app
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: MAIL_USERNAME
        sync: false
      - key: MAIL_PASSWORD
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: CELERY_BROKER_URL
        fromService:
          type: redis
          name: placement-portal-redis
          property: connectionString
      - key: CELERY_RESULT_BACKEND
        fromService:
          type: redis
          name: placement-portal-redis
          property: connectionString
      - key: CACHE_REDIS_URL
        fromService:
          type: redis
          name: placement-portal-redis
          property: connectionString
      - key: DATABASE_URL
        fromDatabase:
          name: placement-portal-db
          property: connectionString

  - type: worker
    name: placement-portal-worker
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: celery -A celery_worker.celery worker --loglevel=info
    envVars:
      - key: SECRET_KEY
        fromService:
          type: web
          name: placement-portal-web
          envVarKey: SECRET_KEY
      - key: JWT_SECRET_KEY
        fromService:
          type: web
          name: placement-portal-web
          envVarKey: JWT_SECRET_KEY
      - key: MAIL_USERNAME
        sync: false
      - key: MAIL_PASSWORD
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: CELERY_BROKER_URL
        fromService:
          type: redis
          name: placement-portal-redis
          property: connectionString
      - key: CELERY_RESULT_BACKEND
        fromService:
          type: redis
          name: placement-portal-redis
          property: connectionString
      - key: DATABASE_URL
        fromDatabase:
          name: placement-portal-db
          property: connectionString

  - type: redis
    name: placement-portal-redis
    plan: free

databases:
  - name: placement-portal-db
    databaseName: placement_portal
    plan: free