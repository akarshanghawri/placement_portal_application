<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Placement Portal</title>
    <link href="https://cdn.jsdelivr.net/npm/bootswatch@5.3.0/dist/flatly/bootstrap.min.css" rel="stylesheet">
    <style>
        input[type="date"] {
            cursor: pointer;
            border-radius: 0.375rem;
            padding: 0.375rem 0.75rem;
        }
        input[type="date"]::-webkit-calendar-picker-indicator {
            cursor: pointer;
            border-radius: 4px;
            padding: 2px;
            filter: opacity(0.7);
            transition: all 0.2s ease-in-out;
        }
        input[type="date"]::-webkit-calendar-picker-indicator:hover {
            filter: opacity(1);
            background-color: rgba(13, 110, 253, 0.1);
        }
        .form-range {
            height: 1.2rem;
        }
        .form-range::-webkit-slider-thumb {
            background-color: #0d6efd;
            box-shadow: 0 0 4px rgba(13, 110, 253, 0.4);
        }
    </style>
</head>
<body>

<div id="app"></div>

<script
    async
    crossorigin="anonymous"
    data-clerk-publishable-key="{{ clerk_publishable_key }}"
    src="{{ clerk_frontend_api }}/npm/@clerk/clerk-js@latest/dist/clerk.browser.js"
    type="text/javascript"
></script>

<script src="https://cdn.jsdelivr.net/npm/vue@3/dist/vue.global.js"></script>
<script src="/static/js/app.js"></script>

</body>
</html>
